[package]
name = "cmdr-restic"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[dependencies]
# The `Volume` trait, every type it exchanges, and the host seams this backend
# asks the app through. The only Cmdr crate below this one.
cmdr-fs = { path = "../cmdr-fs" }
# The pure-Rust restic repository reader (the core of `rustic`). Default features
# are empty (`cli`, `clap`, `merge`, `webdav` are all opt-in), and that's how it
# stays: no CLI parsing, no WebDAV server. ❌ Never add `rustic_backend`: it brings
# rustic's own storage drivers (OpenDAL, SFTP, rest-server) when this crate reads
# the repo through Cmdr's own volumes instead.
rustic_core = { version = "0.13.0", default-features = false }
# The byte buffer type rustic's backend traits exchange. Already in the graph.
bytes = "1"
# The runtime `Handle` the storage adapter `block_on`s the parent's async reads
# on. It arrives through `VolumeHost::runtime`; this crate never builds a runtime.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# `#[tokio::test]` needs `macros`; the adapter's sync-over-async bridge needs a
# multi-threaded runtime to block on from `spawn_blocking`.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
