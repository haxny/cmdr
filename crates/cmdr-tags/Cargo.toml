[package]
name = "cmdr-tags"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[features]
# `specta::Type` on the types the app's IPC carries (`TagField`, `Edit`, `TagTool`, ...), so the
# app's commands can name them without mirror types.
specta = ["dep:specta"]

[dependencies]
# Reads and writes ID3v2, MP4 `ilst`, and Vorbis comments, pure Rust, MIT OR Apache-2.0.
lofty = "0.25.4"
# Optional: only the app, which generates the TypeScript bindings, turns it on (same pin as the app).
specta = { version = "=2.0.0-rc.24", features = ["derive"], optional = true }
# Same regex crate the app pins; the tag tools (rename, find/replace) use it.
regex = "1"
# `TagField`, `FileTags`, and the undo store's records are serialized.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Diacritics removal in the clean-up tools (`text::remove_diacritics`).
unicode-normalization = "0.1"
# The one warning the safe overwrite logs (a directory fsync after the rename).
log = "0.4"
# The safe overwrite's temp file, created next to the file it replaces.
tempfile = "3"

[dev-dependencies]
# Real tagged audio files for the read/write tests.
cmdr-media-meta = { path = "../cmdr-media-meta", features = ["testing"] }
