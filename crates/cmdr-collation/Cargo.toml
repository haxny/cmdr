[package]
name = "cmdr-collation"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[dependencies]
# Unicode collation for file-name ordering: normalization-insensitive, numeric
# ordering (so `img_9` precedes `img_10`), and locale-correct accent placement.
# `unstable` is for `write_sort_key_to`; ICU4X exempts it from semver, and an API
# change there is a compile error, never a silent one. ❌ Never persist a key:
# `src/lib.rs`.
icu_collator = { version = "2.3.1", features = ["unstable"] }
icu_locale_core = "2.2"
