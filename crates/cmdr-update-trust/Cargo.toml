[package]
name = "cmdr-update-trust"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

# The release gate: `cargo run -p cmdr-update-trust --bin cmdr-vet-update -- --version X <archive>...`.
# `scripts/release-finish` runs it before signing, and the release pipeline before publishing.
[[bin]]
name = "cmdr-vet-update"
path = "src/main.rs"

# macOS only: the check is Security.framework's, and the macOS updater is its only other caller.
# On other platforms the crate is empty and the binary says so.
[target.'cfg(target_os = "macos")'.dependencies]
# The Apple code-signature check (`SecStaticCode`, `SecRequirement`).
security-framework = "3.2"
core-foundation = "0.10.1"
# The installer's extraction, which the gate has to share (`archive.rs`).
flate2 = "1"
tar = "0.4"
# Reads the bundle's `Info.plist` version.
plist = "1.8.0"
# Where the gate unpacks an archive it vets.
tempfile = "3"
